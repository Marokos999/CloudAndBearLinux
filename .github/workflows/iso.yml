name: ISO

# Izgrađuje CloudAndBear (Debian 13) live ISO pomoću live-build u Debian kontejneru (debian/build.sh): prvo objavi tvoj GUI (dotnet publish),
# pa ga ugradi u sliku, i proverava da u slici nema nikakvog drugog GUI-ja.
# Pokreće se samo ručno. ISO je artefakt pokretanja (7 dana); sa opcijom "objavi" ide i u izdanje iso-DATUM privatnog repoa (ISO je ispod 2 GiB).

on:
  workflow_dispatch:
    inputs:
      objavi:
        description: "Objavi ISO i u izdanje iso-DATUM (inače samo artefakt)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  iso:
    name: izgradi ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: objavi GUI (CloudAndBear.Desktop, linux-x64, sa .NET runtime-om)
        run: dotnet publish gui/CloudAndBear.Desktop -c Release -r linux-x64 --self-contained -o gui/publish

      - name: izgradi ISO (live-build u Debian 13 kontejneru)
        run: |
          set -o pipefail   # bez ovoga tee krije grešku izgradnje
          mkdir -p out
          docker run --rm --privileged -v "$PWD/debian:/src:ro" -v "$PWD/gui:/gui:ro" -v "$PWD/out:/out" debian:trixie bash /src/build.sh 2>&1 | tee out/build-console.log
          ls -la out

      - name: provera da u slici nema tuđeg GUI-ja
        run: |
          # nikakvih drugih GUI-a: nema desktop okruženja, prozorskog sistema, pretraživača ni grafičkog instalatera.
          # Dozvoljene su samo biblioteke koje tvoj GUI traži (libgl1, Mesa, libwayland-client, libx11-6): to nisu serveri ni okruženja.
          bad=$(grep -E '^(xorg|xserver|x11-|xwayland|wayland|weston|sway|gnome|kde|plasma|xfce|lxde|lxqt|mate-|cinnamon|budgie|gdm3?|lightdm|sddm|xdm|firefox|chromium|epiphany|libgtk|libqt|qt[56]|gtk|calamares|task-.*desktop|desktop-base)' out/cloudandbear-debian.packages.txt || true)
          if [ -n "$bad" ]; then echo "u slici ima GUI paketa:"; echo "$bad"; exit 1; fi
          echo "paketa u slici: $(wc -l < out/cloudandbear-debian.packages.txt), tuđih GUI paketa: 0"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudandbear-debian-iso
          path: |
            out/cloudandbear-debian.iso
            out/cloudandbear-debian.iso.sha256
            out/cloudandbear-debian.packages.txt
            out/cloudandbear-debian.build.log
          retention-days: 7
          compression-level: 0

      - name: objavi u izdanje (opciono)
        if: ${{ inputs.objavi }}
        run: |
          tag="iso-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" --title "ISO $tag" --notes "CloudAndBear (Debian 13) live ISO, workflow ISO. Korisnik live, lozinka live." \
            out/cloudandbear-debian.iso out/cloudandbear-debian.iso.sha256 out/cloudandbear-debian.packages.txt
          echo "izdanje: $tag"
