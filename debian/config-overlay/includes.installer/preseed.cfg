# CloudAndBear: odgovori instalatera (debian-installer čita preseed.cfg iz korena svog initrd-a)
# Pitanja ostaju, ali dobijaju naše podrazumevane vrednosti; ništa se ne pita bez potrebe.

# Srbija: vremenska zona i regulatorna oblast Wi-Fi-ja (jezik ostaje engleski)
d-i debian-installer/country string RS
d-i time/zone string Europe/Belgrade
d-i clock-setup/utc boolean true

# ime računara (podrazumevano "debian")
d-i netcfg/get_hostname string cloudandbear
d-i netcfg/get_domain string

# prvi korisnik ulazi u sudo (bez toga sudo ne radi dok se ne doda ručno) i u docker
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev sudo docker

# apt izvori instaliranog sistema: instalacija sa žive slike ih ne ostavlja, pa se kopira naš fajl iz slike
d-i preseed/late_command string in-target sh -c 'mkdir -p /etc/apt/sources.list.d && cp -f /usr/share/cloudandbear/debian.sources /etc/apt/sources.list.d/debian.sources' || true
